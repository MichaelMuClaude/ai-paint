<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560">
  <defs>
    <radialGradient id="skin" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fff5ee"/><stop offset="1" stop-color="#f3cbb3"/>
    </radialGradient>
    <!-- the character's head, defined once; hair colour comes from color="..." -->
    <g id="head">
      <path d="M -82 -6 C -90 -96 90 -96 82 -6 L 86 70 L 60 60 L 62 0 L -62 0 L -60 60 L -86 70 Z" fill="currentColor" stroke="#1a1240" stroke-width="2"/>
      <path d="M -70 -10 C -70 -80 70 -80 70 -10 C 70 50 40 95 0 105 C -40 95 -70 50 -70 -10 Z" fill="url(#skin)" stroke="#b9806a" stroke-width="1.8"/>
      <path d="M -78 0 C -84 -92 84 -92 78 0 C 70 -24 58 -34 48 -40 C 48 -20 42 -8 34 0 C 28 -24 18 -36 6 -42
               C 6 -20 -2 -6 -12 2 C -18 -22 -28 -34 -40 -40 C -42 -20 -50 -6 -78 0 Z"
            fill="currentColor" stroke="#1a1240" stroke-width="2"/>
      <path d="M -40 -64 C -20 -76 20 -76 40 -64" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.35"/>
    </g>
  </defs>
  <rect width="800" height="560" fill="#fbf8f2"/>
  <path d="M 400 20 L 400 540 M 20 280 L 780 280" stroke="#d8d2c4" stroke-width="2"/>

  <!-- 1. happy -->
  <g transform="translate(200 130)">
    <use href="#head" color="#5a3a8a"/>
    <use href="#lib-eye-closed" transform="translate(-30 18) scale(0.65)" color="#2b1a10"/>
    <use href="#lib-eye-closed" transform="translate(30 18) scale(0.65)" color="#2b1a10"/>
    <use href="#lib-brow" transform="translate(-30 -16) scale(0.55)" color="#2b1f5a"/>
    <use href="#lib-brow" transform="translate(30 -16) scale(-0.55 0.55)" color="#2b1f5a"/>
    <use href="#lib-mouth-grin" transform="translate(0 60) scale(0.6)"/>
    <use href="#lib-blush" transform="translate(-46 42) scale(0.7)" color="#ff8f8f"/>
    <use href="#lib-blush" transform="translate(46 42) scale(0.7)" color="#ff8f8f"/>
    <use href="#lib-sparkle" transform="translate(98 -66)" color="#fff4b0"/>
    <use href="#lib-sparkle" transform="translate(118 -36) scale(0.6)" color="#fff4b0"/>
  </g>
  <text x="200" y="262" font-family="Noto Sans CJK SC" font-size="24" text-anchor="middle" fill="#3a3350">开心</text>

  <!-- 2. surprised -->
  <g transform="translate(600 130)">
    <use href="#head" color="#5a3a8a"/>
    <use href="#lib-eye-anime" transform="translate(-30 20) scale(0.7)" color="#3f7fe0"/>
    <use href="#lib-eye-anime" transform="translate(30 20) scale(-0.7 0.7)" color="#3f7fe0"/>
    <use href="#lib-brow" transform="translate(-30 -26) scale(0.55)" color="#2b1f5a"/>
    <use href="#lib-brow" transform="translate(30 -26) scale(-0.55 0.55)" color="#2b1f5a"/>
    <use href="#lib-mouth-open" transform="translate(0 64) scale(1.1)"/>
    <text x="100" y="-50" font-family="Noto Sans CJK SC" font-size="46" font-weight="bold" fill="#e02020">!</text>
  </g>
  <text x="600" y="262" font-family="Noto Sans CJK SC" font-size="24" text-anchor="middle" fill="#3a3350">惊讶</text>

  <!-- 3. angry -->
  <g transform="translate(200 400)">
    <use href="#head" color="#5a3a8a"/>
    <use href="#lib-eye-anime" transform="translate(-30 22) scale(0.7 0.55)" color="#3f7fe0"/>
    <use href="#lib-eye-anime" transform="translate(30 22) scale(-0.7 0.55)" color="#3f7fe0"/>
    <use href="#lib-brow" transform="translate(-30 -8) rotate(22) scale(0.6)" color="#2b1f5a"/>
    <use href="#lib-brow" transform="translate(30 -8) scale(-1 1) rotate(22) scale(0.6)" color="#2b1f5a"/>
    <use href="#lib-mouth-smile" transform="translate(0 68) scale(1.2 -1.2)"/>
    <use href="#lib-anger-mark" transform="translate(64 -72)" color="#e02020"/>
  </g>
  <text x="200" y="534" font-family="Noto Sans CJK SC" font-size="24" text-anchor="middle" fill="#3a3350">生气</text>

  <!-- 4. nervous -->
  <g transform="translate(600 400)">
    <use href="#head" color="#5a3a8a"/>
    <use href="#lib-eye-anime" transform="translate(-30 22) scale(0.7)" color="#3f7fe0"/>
    <use href="#lib-eye-anime" transform="translate(30 22) scale(-0.7 0.7)" color="#3f7fe0"/>
    <use href="#lib-brow" transform="translate(-30 -18) rotate(-16) scale(0.55)" color="#2b1f5a"/>
    <use href="#lib-brow" transform="translate(30 -18) scale(-1 1) rotate(-16) scale(0.55)" color="#2b1f5a"/>
    <use href="#lib-mouth-smile" transform="translate(0 66) scale(0.8)"/>
    <use href="#lib-sweat-drop" transform="translate(82 -30) scale(1.2)"/>
  </g>
  <text x="600" y="534" font-family="Noto Sans CJK SC" font-size="24" text-anchor="middle" fill="#3a3350">紧张</text>
</svg>
